# Publishes the site, plus a freshly built calendar.ics, on every push to main.
# It commits nothing back, so your local copy never falls behind because of it.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html lib data _site/
          node scripts/build-calendar.mjs _site/calendar.ics
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
