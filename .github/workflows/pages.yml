# Publishes the site, a freshly built calendar.ics and the chat preview card
# (card.png + its <meta> tags) on every push to main.
# It commits nothing back, so your local copy never falls behind because of it.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assemble the site
        env:
          TZ: Europe/Amsterdam              # so "next up" means next up in Delft
          CHROME_PATH: /usr/bin/google-chrome   # already on the runner; nothing to download
        run: |
          mkdir _site
          cp -r index.html lib data _site/
          node scripts/build-calendar.mjs _site/calendar.ics
          # The preview card is a nice-to-have: if it ever fails, publish the site anyway.
          npm install --no-save --no-package-lock playwright-core@1 \
            && node scripts/build-card.mjs _site "${{ steps.pages.outputs.base_url }}/" \
            || echo "::warning::link preview card was not built this time"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
