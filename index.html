<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Tower Brugge — MEL 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Exactly the faces the page renders, measured from its computed styles:
     Fraunces 700-900 plus the 900 italic of the opponent's name, Inter 400-800
     plus italic 700-800 for the masthead and the position badges. Anything not
     loaded here the browser fakes by slanting or smearing the nearest face.
     Two links, so a mistake in one family's axes cannot take down the other. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700..900;1,9..144,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,700..800&display=swap" rel="stylesheet">
<style>
  /* Only enough to stop a flash of unstyled text. The real stylesheet arrives
     stamped, below, so a cached copy of this file can never disagree with it. */
  :root{color-scheme:dark}
  html,body{margin:0;padding:0;background:#0b0c10;color:#eef2f7;
    font-family:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p style="padding:40px 20px;color:#8c97a8">Loading the season…</p></div></div>
<script type="module">
  // Pages caches every file for ten minutes. Styles, icons and logic all change
  // together, so they all load under one stamp — otherwise fresh markup renders
  // against a stale stylesheet, which looks like a bug and is not one.
  const v = `?v=${Date.now()}`;
  await new Promise((done) => {
    const link = Object.assign(document.createElement('link'),
      { rel: 'stylesheet', href: `lib/app.css${v}` });
    link.onload = link.onerror = done;
    document.head.appendChild(link);
  });
  const { boot } = await import(`./lib/render.mjs${v}`);
  boot();
</script>
</body>
</html>
