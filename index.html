<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Tower Brugge — MEL 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Only enough to stop a flash of unstyled text. The real stylesheet arrives
     stamped, below, so a cached copy of this file can never disagree with it. */
  :root{color-scheme:dark}
  html,body{margin:0;padding:0;background:#0b0c10;color:#eef2f7;
    font-family:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<script>
  // Read before anything paints: a skin applied after first paint is a flash.
  try { if (localStorage.getItem('ctb-skin') === 'bold') document.documentElement.dataset.skin = 'bold'; }
  catch (e) { /* private window, no storage — classic is the right fallback */ }
</script>
</head>
<body>
<div id="app"><div class="wrap"><p style="padding:40px 20px;color:#8c97a8">Loading the season…</p></div></div>
<script type="module">
  // Pages caches every file for ten minutes. Styles, icons and logic all change
  // together, so they all load under one stamp — otherwise fresh markup renders
  // against a stale stylesheet, which looks like a bug and is not one.
  const v = `?v=${Date.now()}`;
  await new Promise((done) => {
    let left = 2;
    const each = () => { if (--left === 0) done(); };
    // bold.css only ever adds, and it must win the cascade, so it loads second
    for (const href of [`lib/app.css${v}`, `lib/bold.css${v}`]) {
      const link = Object.assign(document.createElement('link'), { rel: 'stylesheet', href });
      link.onload = link.onerror = each;
      document.head.appendChild(link);
    }
  });
  const { boot } = await import(`./lib/render.mjs${v}`);
  boot();
</script>
</body>
</html>
