<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Tower Brugge — MEL 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --pitch:#0b0c10;--panel:#14171d;--panel-2:#1c212a;--line:#2e3644;
  --chalk:#eef2f7;--mute:#8c97a8;--flood:#e8b43a;--grass:#46b27c;--brick:#d1514a;
  --blue:#0f6fc6;--blue-deep:#0a4f93;--sky:#57aef0;--jet:#05060a;
  --display:"Anton","Arial Narrow",Haettenschweiler,Impact,sans-serif;
  --ui:"Instrument Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--pitch);color:var(--chalk);font-family:var(--ui);font-size:16px;
  line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 72px}

.mast{display:flex;align-items:center;gap:14px;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.mast h1{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;margin:0;line-height:1}
.mast .sub{color:var(--mute);font-size:13px;margin-top:3px}
.mast .spacer{flex:1}
.btn{background:none;border:1px solid var(--line);color:var(--chalk);padding:9px 15px;
  border-radius:999px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--flood);color:var(--flood)}
.btn-solid{background:var(--flood);border-color:var(--flood);color:#0b0c10}
.btn-solid:hover{background:#ffc75c;border-color:#ffc75c;color:#0b0c10}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-ghost{border-color:transparent;color:var(--mute);padding:9px 10px}
.btn-ghost:hover{color:var(--chalk)}

.hero{position:relative;overflow:hidden;padding:46px 0 40px;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;top:-60px;bottom:-60px;left:42%;right:-25%;
  background:repeating-linear-gradient(115deg,rgba(15,111,198,.34) 0 30px,rgba(5,6,10,0) 30px 60px);
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0),#000 60%,rgba(0,0,0,.15));
  mask-image:linear-gradient(90deg,rgba(0,0,0,0),#000 60%,rgba(0,0,0,.15));pointer-events:none}
.hero>*{position:relative}
.kick{color:var(--flood);font-size:13px;font-weight:600;letter-spacing:.06em;margin-bottom:10px}
.opp{font-family:var(--display);font-weight:400;line-height:.9;letter-spacing:.01em;
  font-size:clamp(40px,11vw,86px);margin:0 0 16px;max-width:15ch}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:15px}
.hero .meta b{font-weight:600}
.dim{color:var(--mute)}
.count{margin-top:20px;display:inline-flex;align-items:baseline;gap:9px;border:1px solid var(--line);
  border-radius:999px;padding:7px 16px}
.count strong{font-family:var(--display);font-size:20px;font-weight:400;color:var(--flood)}
.count span{font-size:13px;color:var(--mute)}
.note{margin-top:20px;border-left:3px solid var(--flood);padding:2px 0 2px 14px;font-size:15px;
  max-width:60ch;white-space:pre-line}

.grid{display:grid;gap:0}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr;gap:0 44px}.grid .full{grid-column:1/-1}}
section{padding:30px 0;border-bottom:1px solid var(--line)}
section h2{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em;margin:0 0 4px;line-height:1.1}
section .hint{color:var(--mute);font-size:13px;margin:0 0 18px;max-width:64ch}

.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;
  padding:9px 0;border-bottom:1px solid rgba(46,54,68,.5)}
.lb li:last-child{border-bottom:0}
.lb .rk{color:var(--mute);font-size:13px;text-align:right}
.lb .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .val{font-family:var(--display);font-weight:400;font-size:21px;min-width:2ch;text-align:right}
.lb .bar{grid-column:2/-1;height:3px;background:var(--flood);border-radius:2px;margin-top:-4px;opacity:.75}
.lb li.lead .val{color:var(--flood)}
.lb .sec{color:var(--mute);font-size:13px;font-weight:400;margin-left:8px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-weight:500;color:var(--mute);font-size:12px;padding:0 0 9px;border-bottom:1px solid var(--line)}
.tbl th:nth-child(1),.tbl th:nth-child(2){text-align:left}
.tbl td{padding:8px 0;border-bottom:1px solid rgba(46,54,68,.45);text-align:right}
.tbl td:nth-child(1){color:var(--mute);text-align:left;width:26px}
.tbl td:nth-child(2){text-align:left;font-weight:500}
.tbl td.pts{font-weight:700}
.tbl tr.me td{background:rgba(232,180,58,.09)}
.tbl tr.me td:nth-child(2){box-shadow:inset 3px 0 0 var(--flood);padding-left:9px}

.warn{border:1px solid rgba(232,180,58,.45);background:rgba(232,180,58,.07);border-radius:10px;
  padding:13px 15px;font-size:13.5px;margin-bottom:16px;color:var(--chalk);max-width:66ch}
.warn b{font-weight:600}
.ok{color:var(--grass)}

.rows{margin:0;padding:0;list-style:none}
.rows li{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid rgba(46,54,68,.45);font-size:15px}
.rows .dt{color:var(--mute);font-size:13px}
.rows .vs{overflow:hidden}
.rows .vs .fld{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.rows .sc{font-family:var(--display);font-size:19px;white-space:nowrap}
.rows .sc.w{color:var(--grass)}.rows .sc.l{color:var(--brick)}.rows .sc.d{color:var(--mute)}
.rows .sc.tbd{font-family:var(--ui);font-size:13px;color:var(--mute);font-weight:500}
.moved{color:var(--flood);font-size:12px}

.form{display:inline-flex;gap:4px;vertical-align:middle}
.form i{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-style:normal;
  font-size:11px;font-weight:700;color:#0b0c10}
.form .W{background:var(--grass)}.form .D{background:var(--mute)}.form .L{background:var(--brick)}

.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--mute);font-size:14.5px}
.empty b{display:block;color:var(--chalk);font-weight:600;margin-bottom:4px;font-size:15px}

.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .gl{stroke:rgba(46,54,68,.55);stroke-width:1}
.chart .ln{fill:none;stroke:var(--flood);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--flood)}
.chart .dot.man{fill:var(--pitch);stroke:var(--flood);stroke-width:2}
.chart text{fill:var(--mute);font-size:11px;font-family:var(--ui)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--mute);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--flood);margin-right:6px}
.legend i.man{background:var(--pitch);box-shadow:inset 0 0 0 2px var(--flood)}

.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:1fr 84px auto;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(46,54,68,.5);font-size:15px}
.att .track{height:6px;background:rgba(46,54,68,.7);border-radius:3px;overflow:hidden}
.att .fill{height:100%;background:var(--grass);border-radius:3px}
.att .pc{font-size:13px;color:var(--mute);min-width:6ch;text-align:right}

.foot{padding:22px 0;color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.foot a{color:var(--mute)}

#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;background:var(--pitch);z-index:50;display:flex;flex-direction:column}
.sh-top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh-top h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;flex:1}
.tabs{display:flex;padding:12px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);
  padding:8px 4px;margin-right:18px;font-size:14.5px;font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--flood)}
.sh-body{flex:1;overflow-y:auto;padding:22px 20px 40px}
.sh-inner{max-width:760px;margin:0 auto}
.sh-bot{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel)}
.sh-bot .dirty{flex:1;font-size:13px;color:var(--mute)}
.sh-bot .dirty.on{color:var(--flood)}

.fld{margin-bottom:20px}
.fld label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.inp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.inp:focus{border-color:var(--flood);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.inp{min-height:76px;resize:vertical}
.help{font-size:13.5px;color:var(--mute);margin:0 0 20px;max-width:64ch}
.inline{display:flex;gap:10px}
.inline .inp{flex:1}

.prow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(46,54,68,.5)}
.pname{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;font-size:15px;
  font-weight:500;width:100%;min-width:0}
.pname:focus{border-bottom-color:var(--flood);outline:none}
.pname.out{color:var(--mute);text-decoration:line-through}
.del{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 6px;line-height:1}
.del:hover{color:var(--brick)}

.arow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;
  border-bottom:1px solid rgba(46,54,68,.5)}
.arow .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.arow .who.off{color:var(--mute)}
.arow .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--chalk)}
.seg button.in[aria-pressed="true"]{background:rgba(70,178,124,.25);color:var(--grass)}
.seg button.out[aria-pressed="true"]{background:rgba(209,81,74,.22);color:var(--brick)}
.stp{display:flex;align-items:center;gap:2px}
.stp button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  font-size:15px;line-height:1;display:grid;place-items:center}
.stp button:hover{border-color:var(--flood);color:var(--flood)}
.stp .num{width:30px;text-align:center;background:none;border:0;font-family:var(--display);font-size:17px}
.stp .cap{font-size:11px;color:var(--mute);margin-right:2px}
.stp.off{opacity:.3;pointer-events:none}

.wk{margin-bottom:26px}
.wk h3{font-size:13px;font-weight:600;color:var(--flood);margin:0 0 8px;padding-bottom:7px;
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.wk h3 .cnt{margin-left:auto;font-weight:500;color:var(--mute);font-size:12px}
.wk h3 .cnt.full{color:var(--grass)}
.mrow{display:grid;grid-template-columns:1fr 46px 12px 46px 1fr;gap:7px;align-items:center;padding:8px 0;font-size:14px}
.mrow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tn.away{text-align:right}
.mrow .tn.mine{color:var(--flood);font-weight:600}
.mrow .sep{text-align:center;color:var(--mute)}
.mrow input{width:46px;background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:7px 0;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.mrow input:focus{border-color:var(--flood);outline:none}
.mrow.done input{border-color:rgba(70,178,124,.5)}

.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:18px}
.toggle button{background:none;border:0;padding:7px 15px;font-size:13.5px;font-weight:600;color:var(--mute)}
.toggle button[aria-pressed="true"]{background:var(--panel-2);color:var(--chalk)}

.addbox{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:8px}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.addgrid{grid-template-columns:1fr}}
.pairrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:7px}
.pairrow select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:13.5px;min-width:0}
@media(max-width:620px){.pairrow{grid-template-columns:1fr 1fr}.pairrow select:nth-child(3){grid-column:1/-1}}

.scorebox{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 20px}
.scorebox input{width:62px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:11px 0;text-align:center;font-family:var(--display);font-size:26px}
.scorebox input:focus{border-color:var(--flood);outline:none}
.scorebox .lbl{font-size:13px;color:var(--mute);text-align:center;max-width:12ch}
.recon{font-size:13px;margin:0 0 18px;padding:10px 13px;border-radius:9px;border:1px solid var(--line)}
.recon.bad{border-color:rgba(232,180,58,.5);background:rgba(232,180,58,.07);color:var(--flood)}
.recon.good{border-color:rgba(70,178,124,.45);color:var(--grass)}

@media(max-width:600px){
  .wrap{padding:0 15px 60px}
  .tbl{font-size:13px}
  .tbl th:nth-child(7),.tbl td:nth-child(7),.tbl th:nth-child(8),.tbl td:nth-child(8){display:none}
  .tbl td:nth-child(2){max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rows li{grid-template-columns:62px 1fr auto;gap:10px}
  .mrow{grid-template-columns:1fr 42px 10px 42px 1fr;gap:5px;font-size:13px}
  .mrow input{width:42px}
  .arow{grid-template-columns:1fr;gap:8px}
  .arow .ctl{justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:var(--panel);padding:2px 5px;border-radius:5px}
/* --- Club Brugge livery --- */
body::before{content:"";display:block;height:6px;
  background:repeating-linear-gradient(90deg,var(--blue) 0 16px,var(--jet) 16px 32px)}
.mast{gap:13px}
.crest{flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  background:repeating-linear-gradient(115deg,var(--blue) 0 7px,var(--jet) 7px 14px);
  border:2px solid var(--chalk);box-shadow:0 0 0 1px rgba(232,180,58,.6)}
.btn-solid{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-solid:hover{background:var(--sky);border-color:var(--sky);color:var(--jet)}
.btn:hover{border-color:var(--sky);color:var(--sky)}
.kick{color:var(--sky)}
.count{border-color:var(--line);background:linear-gradient(90deg,rgba(15,111,198,.16),rgba(15,111,198,0))}
.note{border-left-color:var(--blue)}
section h2{padding-left:11px;border-left:3px solid var(--blue)}
.tbl tr.me td{background:rgba(15,111,198,.14)}
.tbl tr.me td:nth-child(2){box-shadow:inset 3px 0 0 var(--flood)}
.att .fill{background:linear-gradient(90deg,var(--blue-deep),var(--blue))}
.att .track{background:rgba(46,54,68,.8)}
.mrow .tn.mine{color:var(--sky)}
.wk h3{color:var(--sky)}
.inp:focus,.mrow input:focus,.scorebox input:focus{border-color:var(--sky)}
.pname:focus{border-bottom-color:var(--sky)}
.stp button:hover{border-color:var(--sky);color:var(--sky)}
.seg button[aria-pressed="true"],.toggle button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg button.in[aria-pressed="true"]{background:rgba(70,178,124,.25);color:var(--grass)}
.seg button.out[aria-pressed="true"]{background:rgba(209,81,74,.22);color:var(--brick)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--blue)}
.form i{color:var(--jet)}
.form .D{background:var(--blue);color:#fff}
.empty{border-color:var(--line)}
/* close button was picking up the browser's default light button face */
.btn-ghost{background:none;border:1px solid transparent;border-radius:999px;font-size:14px;font-weight:600}
.btn-ghost:hover{color:var(--sky)}
@media(max-width:600px){.hero::before{left:56%;background:repeating-linear-gradient(115deg,rgba(15,111,198,.28) 0 22px,rgba(5,6,10,0) 22px 44px)}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="hint" style="padding-top:40px">Loading the season…</p></div></div>
<div id="sheet" hidden></div>
<script type="module">
  import { boot } from './lib/render.mjs';
  boot();
</script>
</body>
</html>
